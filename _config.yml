title: Piyush Praveen
url: https://piyushpraveen.com
markdown: kramdown
future: true
collections:
  breaches:
    output: true
    permalink: /breaches/:name/
  blog:
    output: true
    permalink: /blog/:name/
defaults:
  - scope:
      path: ""
      type: breaches
    values:
      layout: post
  - scope:
      path: ""
      type: blog
    values:
      layout: post
exclude:
  - README.md
  - _templates
