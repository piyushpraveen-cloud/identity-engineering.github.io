---
layout: default
---
<article>
  <header class="post-head">
    <p class="meta"><a href="{{ '/breaches/' | relative_url }}">All breach analyses</a></p>
    <h1>{{ page.title }}</h1>
    <p class="meta">By {{ page.author | default: 'Piyush Praveen' }} on {{ page.date | date: "%-d %B %Y" }}</p>
    <div class="chips">{% for t in page.tags %}<span class="chip">{{ t }}</span>{% endfor %}</div>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
